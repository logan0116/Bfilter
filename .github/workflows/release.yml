name: Release

# 打 tag（v0.1、v0.2 …）时自动出**正式签名**的 APK 并创建 Release。
# 签名材料放在仓库 Secrets 里，不进代码库：
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 生成办法见 README 的「发布新版本」一节。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 是必须的 —— 下面要读 annotated tag 的说明文字，
      # 而默认的浅克隆不拉取 tag。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 先把「缺密钥」这种情况拦下来，给出人话提示；
      # 否则后面会以 "base64: invalid input" 之类的形式炸掉，很难看出真正原因。
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少签名密钥。请在仓库 Settings → Secrets and variables → Actions 中添加 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，办法见 README「发布新版本」。"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Lint and unit tests
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # 用带版本号的文件名，别叫 app-release.apk —— 下载下来一堆同名文件分不清
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "bfilter-${GITHUB_REF_NAME}.apk"
          ls -la bfilter-*.apk

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "bfilter-${GITHUB_REF_NAME}.apk" | head -6

      # Release 正文优先读 `.github/release-notes/<tag>.md`。
      #
      # 为什么不直接用 tag 的说明文字：本地 `git tag -l --format='%(contents)'` 能拿到，
      # 但在 checkout 出来的 CI 工作区里拿到的是空 —— 而空值会 fallback 到 commit message，
      # 结果 Release 正文写成了一条 commit log（v0.1 第一次发布就是这么翻车的）。
      # 放进仓库文件则确定、可 review、也不受 git fetch 行为影响。
      - name: Compose release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          if [ -f "$NOTES_FILE" ]; then
            echo "::notice::使用 $NOTES_FILE 作为 Release 正文"
            BODY=$(cat "$NOTES_FILE")
          else
            echo "::warning::缺少 $NOTES_FILE，退回用 tag 说明文字"
            BODY=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)
            if [ -z "$BODY" ]; then
              BODY=$(git log -1 --pretty=%B)
            fi
          fi

          {
            echo "body<<__BFILTER_NOTES_EOF__"
            printf '%s\n\n' "$BODY"
            echo "### 安装"
            echo
            echo "下载下面的 \`bfilter-${TAG}.apk\` 直接安装。已装旧版的会**正常覆盖升级**（签名一致，不会清数据）。"
            echo
            echo "首次使用：到「UP 主」页添加你想看的人 —— 主页只会出现他们的更新，没有推荐流。"
            echo
            echo "### 校验下载完整性（可选）"
            echo
            echo '```'
            echo "sha256sum bfilter-${TAG}.apk"
            echo '```'
            echo "__BFILTER_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bfilter-*.apk
          body: ${{ steps.notes.outputs.body }}
          draft: false
