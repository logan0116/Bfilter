name: Release

# 打 tag（v0.1、v0.2 …）时自动出**正式签名**的 APK 并创建 Release。
# 签名材料放在仓库 Secrets 里，不进代码库：
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 生成办法见 README 的「发布新版本」一节。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 先把「缺密钥」这种情况拦下来，给出人话提示；
      # 否则后面会以 "base64: invalid input" 之类的形式炸掉，很难看出真正原因。
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少签名密钥。请在仓库 Settings → Secrets and variables → Actions 中添加 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，办法见 README「发布新版本」。"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Lint and unit tests
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
